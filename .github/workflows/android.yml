name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project files
      run: unzip jaan_fixed.zip

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} + || true

    - name: Build APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          if [ -n "$GRADLE_DIR" ]; then
            cd "$GRADLE_DIR" && ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/*.apk'
